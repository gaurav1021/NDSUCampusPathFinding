[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-aware-smart-campus-path-planning"
version = "0.1.0"
description = "Climate-aware intelligent campus path planning for NDSU using A* search."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "CS 724 Project Team" }
]
dependencies = [
  "fastapi>=0.115.0",
  "gtfs-realtime-bindings>=1.0.0",
  "httpx>=0.28.0",
  "networkx>=3.4.0",
  "numpy>=2.1.0",
  "pandas>=2.2.0",
  "plotly>=6.0.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "python-dotenv>=1.0.1",
  "scikit-learn>=1.5.0",
  "streamlit>=1.42.0",
  "uvicorn>=0.32.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
